{% extends "base.html" %}
{% block content %}
<div style="background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
    <a href="{{ url_for('index') }}" style="color: #64748b; text-decoration: none; font-size: 0.875rem;">← Back to
        Modules</a>
    <span
        style="background: #e0e7ff; color: #4f46e5; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; float: right;">{{
        module.title }}</span>

    <h2 style="color: #1e293b; margin-top: 1rem;">{{ lesson.title }}</h2>
    <p style="font-size: 1.1rem; line-height: 1.6; color: #334155;">{{ lesson.content }}</p>

    <h4 style="margin-top: 2rem; color: #1e293b;">Code Example:</h4>
    <pre
        style="background: #0f172a; color: #38bdf8; padding: 1.25rem; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 1rem;"><code>{{ lesson.code_example }}</code></pre>

    <div style="margin-top: 2rem; display: flex; justify-content: space-between;">
        <a href="{{ url_for('practice') }}"
            style="background: #4f46e5; color: white; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold;">Try
            Interactive Practice →</a>
    </div>
</div>
{% endblock %}
